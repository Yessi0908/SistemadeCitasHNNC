# NGINX — HTTPS local para el hospital
# Colocar certificados en nginx/certs/ (cert.pem y key.pem)

worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream django_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 443 ssl;
        server_name hospital.local;

        ssl_certificate     certs/cert.pem;
        ssl_certificate_key certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 10M;

        location /static/ {
            # Ajuste esta ruta a la carpeta staticfiles de su instalacion local.
            alias /ruta/del/proyecto/staticfiles/;
        }

        location /logo/ {
            proxy_pass http://django_backend;
        }

        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 80;
        server_name hospital.local;
        return 301 https://$host$request_uri;
    }
}
